name: Validate reconstruction

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python3 scripts/update-dashboard.py
      - run: python3 scripts/generate-claim-index.py
      - run: jupyter-book build --all book
