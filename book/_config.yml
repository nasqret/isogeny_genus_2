title: Genus 2 Elliptic Covers and Complements
author: Bartosz Naskrecki
copyright: "2026"
only_build_toc_files: true

execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence
    - dollarmath
    - linkify

html:
  use_issues_button: false
  use_repository_button: true

repository:
  url: https://github.com/nasqret/isogeny_genus_2
  branch: main
  path_to_book: book

sphinx:
  config:
    html_show_copyright: false
    html_context:
      default_mode: light
    html_theme_options:
      navigation_with_keys: true
